version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - "dependencies"
    groups:
      npm-patch:
        update-types: [patch]
      npm-updates:
        update-types: [minor, major]
    ignore:
      # @apollo/server 5.5.1 peer range is ^16.11.0, hold graphql on the current major
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - "ci"
    groups:
      github-actions-patch:
        update-types: [patch]
      github-actions-updates:
        update-types: [minor, major]
